{% extends "vault/base.html" %}
{% load widget_tweaks %}

{% block content %}
<h2>
    {% if form.instance.pk %}
        Edit Link
    {% else %}
        Add Link
    {% endif %}
</h2>

<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
        <label for="id_title" class="form-label">Title</label>
        {{ form.title|add_class:"form-control" }}
    </div>
    <div class="mb-3">
        <label for="id_url" class="form-label">URL</label>
        {{ form.url|add_class:"form-control" }}
    </div>
    <button type="submit" class="btn btn-success">
        {% if form.instance.pk %}Update{% else %}Add{% endif %}
    </button>
    <a href="{% url 'link_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
