{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Signup - SecureHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center vh-100">
        <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%;">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Create an Account</h2>
                <p class="text-muted">Join SecureHub today</p>
            </div>

            <!-- Signup Form -->
            <form method="post" novalidate>
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>

            <!-- Divider -->
            <div class="text-center my-3">
                <hr>
                <span class="bg-white px-2 text-muted">OR</span>
            </div>

            <!-- Google Sign-In -->
            <a href="{% provider_login_url 'google' %}" class="btn btn-outline-danger w-100">
                <i class="fab fa-google"></i> Sign up with Google
            </a>

            <!-- Already have an account -->
            <p class="mt-3 text-center">
                Already have an account?
                <a href="{% url 'login' %}" class="fw-bold">Login here</a>
            </p>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>

</html>
