{% extends 'vault/base.html' %}
{% load socialaccount %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="mb-3">Login</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required id="id_username">
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required id="id_password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <!-- Divider -->
        <div class="text-center my-3">
            <hr>
            <span class="bg-white px-2">OR</span>
        </div>

        <!-- Google Login -->
        <div class="d-grid">
            <a href="{% provider_login_url 'google' %}" class="btn btn-danger w-100">
                <i class="bi bi-google"></i> Sign in with Google
            </a>
        </div>

        <!-- Signup link -->
        <p class="mt-3 text-center">
            Don’t have an account? <a href="{% url 'signup' %}">Create an Account</a>
        </p>
    </div>
</div>
{% endblock %}
